[package]
name = "fieldnote-api"
version = "0.1.0"
edition = "2021"

[dependencies]
a3s-code-core = { version = "=9.1.1", default-features = false, features = ["minimal"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
